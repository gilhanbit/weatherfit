<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/defaultLayout}">
<th:block layout:fragment="content">


    <!-- 유저 정보 -->
    <section class="container contents d-flex justify-content-between align-items-end">
        <span>
            <h3 th:text="|${session.userName}님 안녕하세요|"></h3>
        </span>
        <a href="#" class="more-btn" data-toggle="modal" data-target="#modal">
            회원탈퇴
        </a>
    </section>
    <div class="container">
        <span th:text="${session.userLoginId}"></span>
    </div>


    <!-- 유저 정보 변경 -->
    <section class="container contents bg-light rounded d-flex align-items-center">
        <section>
            <div class="mb-4">변경 비밀번호</div>
            <div class="mb-4">변경 비밀번호 확인</div>
            <div>이메일</div>
        </section>
        <section>
            <form id="update-info-form" method="post" action="/user/update-info">
                <div class="sign-up-input mb-2">
                    <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요">
                </div>
                <div class="sign-up-input mb-2">
                    <input type="password" class="form-control" id="checkPassword" name="checkPassword" placeholder="비밀번호를 입력하세요">
                </div>
                <div class="sign-up-input d-flex align-items-center">
                    <input type="text" class="form-control" id="email" name="email" placeholder="이메일을 입력하세요">
                </div>
            </form>
        </section>
        <small style="margin-top:93px;" th:text="|사용 중인 이메일: ${user.email}|"></small>
        <section>
            <button type="submit" id="infoSaveBtn" class="btn btn-secondary" th:data-user-id="${session.userId}">저장</button>
        </section>
    </section>


    <!-- 유저 스타일 -->
    <div class="container d-flex justify-content-start align-items-end" style="height:150px;">
        <h3>선호 스타일</h3>
    </div>
    <section class="container contents bg-light rounded d-flex justify-content-start align-items-center">
        <section style="margin-left:130px;">
            <div class="mb-4">상의</div>
            <div class="mb-4">하의</div>
            <div>신발</div>
        </section>
        <section style="margin-left:90px;">
            <form id="style-form" method="post" action="/user/style">
                <div class="d-flex align-items-center mb-4">
                    <select id="top" name="top" class="text-center" style="width:350px;">
                        <option>캐주얼</option>
                        <option>스포티</option>
                        <option>스트릿</option>
                        <option>클래식</option>
                        <option>미니멀</option>
                        <option>로맨틱</option>
                    </select>
                </div>
                <div class="d-flex align-items-center mb-4">
                    <select id="bottom" name="bottom" class="text-center" style="width:350px;">
                        <option>캐주얼</option>
                        <option>스포티</option>
                        <option>스트릿</option>
                        <option>클래식</option>
                        <option>미니멀</option>
                        <option>스커트</option>
                    </select>
                </div>
                <div class="d-flex align-items-center">
                    <select id="shoes" name="shoes" class="text-center" style="width:350px;">
                        <option>운동화</option>
                        <option>단화</option>
                        <option>구두</option>
                        <option>힐</option>
                        <option>부츠</option>
                        <option>슬리퍼</option>
                    </select>
                </div>
            </form>
        </section>
        <section>
            <div class="mb-4" th:text="${style.top}">캐주얼</div>
            <div class="mb-4" th:text="${style.bottom}">미니멀</div>
            <div th:text="${style.shoes}">운동화</div>
        </section>
        <section style="margin-left:180px;">
            <button type="submit" id="styleSaveBtn" class="btn btn-secondary" th:data-user-id="${session.userId}">저장</button>
        </section>
    </section>


    <!-- EDA -->
    <section class="mt-5 mb-5">
        <section class="container contents d-flex justify-content-between align-items-center mb-5">
            <span>또래 동성 선호 키워드</span>
            <div class="keywordChartByGA"></div>
            <span>또래 동성 선호 가격</span>
            <div class="priceChartByGA"></div>
        </section>
        <section class="container contents d-flex justify-content-between align-items-center">
            <span>내 주변 선호 키워드</span>
            <div class="keywordChartByLocation"></div>
            <span>내 주변 선호 가격</span>
            <div class="priceChartByLocation"></div>
        </section>
    </section>


    <!-- 콕 리스트 (랜덤하게 가져오는 것보다 desc로 가져오는 것이 현재 날씨와 적합) -->
    <div class="container d-flex justify-content-start align-items-end" style="height:150px;">
        <h3>
            <a href="/user/like">콕 리스트</a>
        </h3>
    </div>
    <section class="container">
        <div class="wrap-vertical custom-style d-flex justify-content-between align-items-center">
            <div class="custom-style-box d-flex justify-content-center align-items-center" th:each="like:${likeList10}">
                <a th:href="${like.link}">
                    <img th:src="${like.image}" width="300px" height="400px">
                </a>
            </div>
        </div>
    </section>


    <!-- Modal -->
    <div class="modal fade" id="modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content text-center">
                <div class="py-3 border-bottom">
                    <a href="#" id="">사용하기 불편함</a>
                </div>
                <div class="py-3 border-bottom">
                    <a href="#" id="">기능이 부족함</a>
                </div>
                <div class="py-3 border-bottom">
                    <a href="#" id="">더이상 사용하지 않음</a>
                </div>
                <div class="py-3">
                    <a href="#" data-dismiss="modal">취소</a>
                </div>
            </div>
        </div>
    </div>


    <script th:inline="javascript">
        $(function(){
            // style keyword GA
            const topObj    = /*[[${topChartByGA}]]*/ {};
            const bottomObj = /*[[${bottomChartByGA}]]*/ {};
            const shoesObj  = /*[[${shoesChartByGA}]]*/ {};

            // 값과 키 분리
            const keys = o => Object.keys(o || {});
            const vals = o => Object.values(o || {});

            const topK = keys(topObj),    topV = vals(topObj);
            const botK = keys(bottomObj), botV = vals(bottomObj);
            const shoK = keys(shoesObj),  shoV = vals(shoesObj);

            // x축
            const categories = ['Top', 'Bottom', 'Shoes'];

            // 시리즈: Top, Bottom, Shoes
            const n = x => Number(x ?? 0);
            const columns = [
              ['1위', n(topV[0]), n(botV[0]), n(shoV[0])],
              ['2위', n(topV[1]), n(botV[1]), n(shoV[1])],
              ['3위', n(topV[2]), n(botV[2]), n(shoV[2])]
            ];

            // 카테고리별 키워드 저장 (툴팁용)
            const kwBySeries = { Top: topK, Bottom: botK, Shoes: shoK };

            c3.generate({
              bindto: '.keywordChartByGA',
              data: {
                columns,
                type: 'bar'
              },
              axis: {
                x: {
                  type: 'category',
                  categories: categories
                }
              },
              tooltip: {
                format: {
                  value: function (value, ratio, id, index) {
                      const rankMap = { '1': 0, '2': 1, '3': 2 };
                      const cat = categories[index];
                      const r = rankMap[id] ?? 0;
                      const keyLabel = (kwBySeries[cat] && kwBySeries[cat][r]) ? kwBySeries[cat][r] : '';
                      return keyLabel ? `${value} (${keyLabel})` : String(value);
                    }
                }
              },
              bar: { width: { ratio: 0.6 } }
            });


            // price GA
            // 컨트롤러에서 int 하나씩 넘어옴 → 숫자로 캐스팅
            const topPrice    = Number(/*[[${topPriceChartByGA}]]*/ 0);
            const bottomPrice = Number(/*[[${bottomPriceChartByGA}]]*/ 0);
            const shoesPrice  = Number(/*[[${shoesPriceChartByGA}]]*/ 0);

            const x = ['Top', 'Bottom', 'Shoes'];

            // 단일 시리즈 'Price'에 3개 값
            const y = [
              ['가격', topPrice, bottomPrice, shoesPrice],
            ];

            c3.generate({
              bindto: '.priceChartByGA',
              data: {
                columns: y,          // ✅ y를 columns로 전달
                type: 'bar'
              },
              axis: {
                x: {
                  type: 'category',
                  categories: x
                }
              },
              tooltip: {
                format: {
                  // 마우스 오버 시: "Top 12345" 형태
                  value: function (value, ratio, id, index) {
                    return x[index] + ' ' + d3.format(',')(value) + '원';
                  }
                }
              },
              bar: { width: { ratio: 0.6 } }
            });


            // style keyword location
            const topObje    = /*[[${topChartByLocation}]]*/ {};
            const bottomObje = /*[[${bottomChartByLocation}]]*/ {};
            const shoesObje  = /*[[${shoesChartByLocation}]]*/ {};

            // 값과 키 분리 (이 블록 전용 함수명 사용)
            const keyss = o => Object.keys(o || {});
            const valss = o => Object.values(o || {});

            // ⚠️ 여기에서 keyss/valss 사용 (keys/vals 아님)
            const topKs = keyss(topObje),    topVs = valss(topObje);
            const botKs = keyss(bottomObje), botVs = valss(bottomObje);
            const shoKs = keyss(shoesObje),  shoVs = valss(shoesObje);

            // x축
            const categoriess = ['Top', 'Bottom', 'Shoes'];

            // 시리즈
            const ns = x => Number(x ?? 0);
            const columnss = [
              ['1위', ns(topVs[0]), ns(botVs[0]), ns(shoVs[0])],
              ['2위', ns(topVs[1]), ns(botVs[1]), ns(shoVs[1])],
              ['3위', ns(topVs[2]), ns(botVs[2]), ns(shoVs[2])]
            ];

            // 카테고리별 키워드 (툴팁용)
            const kwBySeriess = { Top: topKs, Bottom: botKs, Shoes: shoKs };

            c3.generate({
              bindto: '.keywordChartByLocation',
              data: {
                // ⚠️ 'columns' 키로 전달해야 함
                columns: columnss,
                type: 'bar'
              },
              axis: {
                x: { type: 'category', categories: categoriess }
              },
              tooltip: {
                format: {
                  value: function (value, ratio, id, index) {
                    const rankMap = { '1': 0, '2': 1, '3': 2 };
                    const cat = categoriess[index];
                    const r = rankMap[id] ?? 0;
                    const keyLabel = (kwBySeriess[cat] && kwBySeriess[cat][r]) ? kwBySeriess[cat][r] : '';
                    return keyLabel ? `${value} (${keyLabel})` : String(value);
                  }
                }
              },
              bar: { width: { ratio: 0.6 } }
            });


            // price location
            // 컨트롤러에서 int 하나씩 넘어옴 → 숫자로 캐스팅
            const topPriceLocal    = Number(/*[[${topPriceChartByLocation}]]*/ 0);
            const bottomPriceLocal = Number(/*[[${bottomPriceChartByLocation}]]*/ 0);
            const shoesPriceLocal  = Number(/*[[${shoesPriceChartByLocation}]]*/ 0);

            const xLocal = ['Top', 'Bottom', 'Shoes'];

            // 단일 시리즈 'Price'에 3개 값
            const yLocal = [
              ['가격', topPriceLocal, bottomPriceLocal, shoesPriceLocal],
            ];

            c3.generate({
              bindto: '.priceChartByLocation',
              data: {
                columns: yLocal,          // ✅ y를 columns로 전달
                type: 'bar'
              },
              axis: {
                x: {
                  type: 'category',
                  categories: xLocal
                }
              },
              tooltip: {
                format: {
                  // 마우스 오버 시: "Top 12345" 형태
                  value: function (value, ratio, id, index) {
                    return xLocal[index] + ' ' + d3.format(',')(value) + '원';
                  }
                }
              },
              bar: { width: { ratio: 0.6 } }
            });


            $("#infoSaveBtn").on("click",function(e){
                e.preventDefault();

                let userId = $(this).data("user-id");
                let password = $("#password").val().trim();
                let checkPassword = $("#checkPassword").val().trim();
                let email = $("#email").val().trim();

                if(!password){
                    alert("비밀번호를 입력해주세요.");
                    return;
                }

                if(password != checkPassword){
                    alert("비밀번호가 일치하지 않습니다.");
                    return;
                }

                let url = $("#update-info-form").attr("action");
                let params = $("#update-info-form").serialize();
                params += "&userId=" + encodeURIComponent(userId);

                $.post(url, params)
                .done(function(data) {
                    if (data.code == 200) {
                        alert(data.message)
                        const form = document.createElement("form");
                        form.method = "post";
                        form.action = "/user/mypage";
                        document.body.appendChild(form);
                        form.submit();
                    } else {
                        alert(data.message);
                    }
                });
            });

            $("#styleSaveBtn").on("click",function(e){
                e.preventDefault();

                let userId = $(this).data("user-id");
                let top = $("#top").val();
                let bottom = $("#bottom").val();
                let shoes = $("#shoes").val();


                let url = $("#style-form").attr("action");
                let params = $("#style-form").serialize();
                params += "&userId=" + encodeURIComponent(userId);

                $.post(url, params)
                .done(function(data) {
                    if (data.code == 200) {
                        alert(data.message)
                        const form = document.createElement("form");
                        form.method = "post";
                        form.action = "/user/mypage";
                        document.body.appendChild(form);
                        form.submit();
                    } else {
                        alert("저장에 실패했습니다.");
                    }
                });
            });
        });
    </script>
</th:block>
